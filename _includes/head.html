{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
<style>
  body {
    background-color: #f8f9fa !important;
    color: #2c3e50 !important;
  }
  /* Stile pulito per la barra di intestazione */
  .masthead {
    background-color: #ffffff !important;
    border-bottom: 2px solid #334e68 !important;
    padding: 15px 0 !important;
  }
  .masthead a, .site-title {
    color: #243b53 !important;
    font-weight: 600 !important;
  }
  .site-title:hover {
    color: #102a43 !important;
  }
</style>
